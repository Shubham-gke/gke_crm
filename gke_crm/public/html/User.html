
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Users</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont,
                 'Segoe UI', Helvetica, Arial, sans-serif;
}

body {
    background: #f5f5f5;
    color: #222;
    padding: 20px;
    -webkit-font-smoothing: antialiased;
}

.page {
    max-width: 1400px;
    margin: 0 auto;
}

.card {
    background: #fff;
    border-radius: 10px;
    border: 1px solid #d6d6d6;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
    overflow: hidden;
}

.card-header {
    padding: 18px 24px;
    border-bottom: 1px solid #e5e5e5;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
}

.card-header h2 {
    font-size: 18px;
    font-weight: 700;
    color: #111;
}

.sub {
    font-size: 12px;
    color: #777;
    margin-top: 4px;
}

.toolbar {
    padding: 18px 24px;
    display: flex;
    gap: 12px;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    border-bottom: 1px solid #eee;
}

.search {
    width: 100%;
    max-width: 380px;
    padding: 10px 13px;
    border: 1px solid #d6d6d6;
    border-radius: 7px;
    font-size: 13px;
    outline: none;
}

.search:focus {
    border-color: #777;
}

button {
    padding: 10px 16px;
    background: #222;
    color: #fff;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.count {
    font-size: 12px;
    color: #666;
}

.table-wrap {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 1100px;
}

thead {
    background: #f8f8f8;
}

th {
    padding: 13px 16px;
    text-align: left;
    font-size: 11px;
    font-weight: 700;
    color: #666;
    text-transform: uppercase;
    letter-spacing: .3px;
    border-bottom: 1px solid #e5e5e5;
    white-space: nowrap;
}

td {
    padding: 14px 16px;
    font-size: 12.5px;
    color: #333;
    border-bottom: 1px solid #eee;
    overflow-wrap: anywhere;
}

tbody tr:hover {
    background: #fafafa;
}

tbody tr:last-child td {
    border-bottom: none;
}

.user-name {
    font-weight: 600;
    color: #222;
}

.email {
    color: #555;
}

.status {
    padding: 36px 20px;
    text-align: center;
    color: #777;
    font-size: 13px;
}

.status.error {
    color: #c0392b;
}

.footer {
    padding: 14px 24px;
    border-top: 1px solid #eee;
    font-size: 12px;
    color: #777;
}

@media (max-width: 600px) {
    body {
        padding: 10px;
    }

    .card-header,
    .toolbar {
        padding: 15px;
    }

    .search {
        max-width: 100%;
    }
}
</style>
</head>

<body>
<div class="page">
    <div class="card">

        <div class="card-header">
            <div>
                <h2>All Users</h2>
                <div class="sub">User directory and account details</div>
            </div>
            <button id="refreshBtn" type="button" onclick="loadUsers()">
                Refresh
            </button>
        </div>

        <div class="toolbar">
            <input
                type="search"
                id="searchInput"
                class="search"
                placeholder="Search by name, email, username..."
                autocomplete="off"
            >
            <div class="count" id="userCount">Loading users...</div>
        </div>

        <div id="status" class="status">Loading users...</div>

        <div class="table-wrap" id="tableWrap" style="display:none;">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>User ID</th>
                        <th>Email</th>
                        <th>Full Name</th>
                        <th>First Name</th>
                        <th>Middle Name</th>
                        <th>Last Name</th>
                        <th>Username</th>
                        <th>Language</th>
                        <th>Time Zone</th>
                    </tr>
                </thead>
                <tbody id="userTableBody"></tbody>
            </table>
        </div>

        <div class="footer" id="footer">
            User directory
        </div>

    </div>
</div>

<script>
"use strict";

const API_URL =
    "https://gkexport-crm.m.frappe.cloud/api/method/get_user";

let allUsers = [];

function safeValue(value) {
    if (value === null || value === undefined ||
        String(value).trim() === "") {
        return "-";
    }
    return String(value);
}

function escapeHtml(value) {
    return safeValue(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function showStatus(message, isError = false) {
    const status = document.getElementById("status");
    status.textContent = message;
    status.className = isError ? "status error" : "status";
    status.style.display = "block";
    document.getElementById("tableWrap").style.display = "none";
}

function normalizeUsers(response) {
    // Supports common Frappe API response formats.
    const message = response?.message;

    if (Array.isArray(message)) return message;
    if (Array.isArray(message?.data)) return message.data;
    if (Array.isArray(message?.users)) return message.users;
    if (Array.isArray(response?.data)) return response.data;

    // Also supports a single user object.
    if (message && typeof message === "object" &&
        (message.name || message.email)) {
        return [message];
    }

    return [];
}

async function loadUsers() {
    const button = document.getElementById("refreshBtn");
    button.disabled = true;
    button.textContent = "Loading...";

    showStatus("Loading users...");
    document.getElementById("userCount").textContent =
        "Fetching user details...";

    try {
        const response = await fetch(API_URL, {
            method: "GET",
            credentials: "same-origin",
            headers: {
                "Accept": "application/json"
            }
        });

        if (!response.ok) {
            throw new Error(
                "API request failed. HTTP " + response.status
            );
        }

        const result = await response.json();

        if (result.exc || result.exception) {
            throw new Error("Frappe API returned an error.");
        }

        allUsers = normalizeUsers(result);
        renderUsers();

        if (allUsers.length === 0) {
            showStatus(
                "No users found, or API response format is different."
            );
        }

    } catch (error) {
        console.error("Load users error:", error);

        showStatus(
            "Users load nahi hue. API response, login permissions, " +
            "ya browser CORS settings check karein. " + error.message,
            true
        );

        document.getElementById("userCount").textContent =
            "Unable to load users";

    } finally {
        button.disabled = false;
        button.textContent = "Refresh";
    }
}

function renderUsers() {
    const query = document.getElementById("searchInput")
        .value.trim().toLowerCase();

    const filteredUsers = allUsers.filter(user => {
        const searchableFields = [
            user.name,
            user.email,
            user.full_name,
            user.first_name,
            user.middle_name,
            user.last_name,
            user.username,
            user.language,
            user.time_zone
        ];

        return searchableFields.some(value =>
            String(value ?? "").toLowerCase().includes(query)
        );
    });

    document.getElementById("userCount").textContent =
        `${filteredUsers.length} of ${allUsers.length} users`;

    document.getElementById("footer").textContent =
        `Showing ${filteredUsers.length} users`;

    const tbody = document.getElementById("userTableBody");

    if (filteredUsers.length === 0) {
        tbody.innerHTML = "";
        document.getElementById("tableWrap").style.display = "none";
        showStatus(
            allUsers.length
                ? "Search se koi matching user nahi mila."
                : "No users found."
        );
        return;
    }

    tbody.innerHTML = filteredUsers.map((user, index) => `
        <tr>
            <td>${index + 1}</td>
            <td class="user-name">${escapeHtml(user.name)}</td>
            <td class="email">${escapeHtml(user.email)}</td>
            <td class="user-name">${escapeHtml(user.full_name)}</td>
            <td>${escapeHtml(user.first_name)}</td>
            <td>${escapeHtml(user.middle_name)}</td>
            <td>${escapeHtml(user.last_name)}</td>
            <td>${escapeHtml(user.username)}</td>
            <td>${escapeHtml(user.language)}</td>
            <td>${escapeHtml(user.time_zone)}</td>
        </tr>
    `).join("");

    document.getElementById("status").style.display = "none";
    document.getElementById("tableWrap").style.display = "block";
}

document.getElementById("searchInput")
    .addEventListener("input", renderUsers);

loadUsers();
</script>
</body>
</html>
